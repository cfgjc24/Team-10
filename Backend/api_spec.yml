openapi: 3.0.0
info:
  title: User Authentication API
  description: A simple user authentication API with registration, login, and dashboard endpoints.
  version: 1.0.0

servers:
  - url: ec2-52-55-76-187.compute-1.amazonaws.com:80

paths:
  /register:
    post:
      summary: Register a new user
      description: Creates a new user account by taking name, email, and password.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: John Doe
                email:
                  type: string
                  example: john@example.com
                password:
                  type: string
                  example: password123
      responses:
        '200':
          description: Successfully registered the user
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Registration successful. Please log in.
        '400':
          description: Validation error (e.g., email already taken)
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Email already taken

  /login:
    post:
      summary: Login a user
      description: Logs in a user by verifying email and password.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  example: john@example.com
                password:
                  type: string
                  example: password123
      responses:
        '200':
          description: Successfully logged in the user
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Logged in successfully.
        '401':
          description: Login failed due to invalid email or password
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Login failed. Please check your email and password.

  /dashboard:
    get:
      summary: View dashboard
      description: Returns the dashboard for the logged-in user. Requires authentication via session.
      responses:
        '200':
          description: Successfully retrieved the dashboard
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                    example: 1
                  name:
                    type: string
                    example: John Doe
                  email:
                    type: string
                    example: john@example.com
        '401':
          description: User not logged in or session expired
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: You must log in first.

  /logout:
    get:
      summary: Log out a user
      description: Logs out the current user by clearing the session.
      responses:
        '200':
          description: Successfully logged out the user
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: You have been logged out successfully.

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: session

security:
  - sessionCookie: []
